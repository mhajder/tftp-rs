[package]
name = "tftp-rs"
version = "0.4.2"
edition = "2024"
description = "Async TFTP server with a live TUI dashboard, also embeddable as a tokio library: blksize, tsize, timeout and windowsize options (RFC 2347-2349, 7440), netascii and an optional HTTP file browser"
license = "MIT"
authors = ["Mateusz Hajder"]
readme = "README.md"
repository = "https://github.com/mhajder/tftp-rs"
documentation = "https://docs.rs/tftp-rs"
keywords = ["tftp", "tftp-server", "tftpd", "pxe", "tui"]
categories = ["network-programming", "command-line-utilities", "asynchronous"]
include = ["/src", "/tests", "/LICENSE", "/README.md", "/CHANGELOG.md"]

[lib]
name = "tftp_rs"
path = "src/lib.rs"

[[bin]]
name = "tftp-rs"
path = "src/main.rs"
required-features = ["tui"]

[features]
default = ["tui"]
tui = [
    "dep:axum",
    "dep:clap",
    "dep:crossterm",
    "dep:if-addrs",
    "dep:ratatui",
    "dep:tokio-util",
]

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"], optional = true }
clap = { version = "4.6.7", default-features = false, features = ["derive", "std", "help", "usage", "error-context"], optional = true }
crossterm = { version = "0.29", optional = true }
if-addrs = { version = "0.15", optional = true }
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "layout-cache", "underline-color"], optional = true }
socket2 = { version = "0.6.5", features = ["all"] }
tokio = { version = "1.54.1", features = ["fs", "io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7.20", features = ["io"], optional = true }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[package.metadata.docs.rs]
no-default-features = true
targets = ["x86_64-unknown-linux-gnu"]

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
opt-level = "s"
